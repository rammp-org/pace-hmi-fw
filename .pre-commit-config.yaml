repos:
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v14.0.6
    hooks:
    -   id: clang-format
        # Not formatted here: generated code (never hand-edited, CS-LAY-04) and
        # vendored or third-party code (CS-LAY-05), formatted by its upstream.
        #   components/ui/            SquareLine export, regenerated on every import
        #   components/m5stack-tab5/  vendored Tab5 BSP
        #   components/espp_adc/      the vendored espp adc upstream files, by name (our hook
        #                             lines in continuous_adc.hpp are formatted)
        #   managed_components/       ESP-IDF component manager downloads
        #   external/                 the rammp-rtps submodule
        #   main/boot_logo.[ch]       generated by rasterise_logo.py
        exclude: |
          (?x)(
          ^components/ui/|
          ^components/m5stack-tab5/|
          ^components/espp_adc/include/(adc_types|oneshot_adc)\.hpp$|
          ^components/espp_adc/upstream/|
          ^managed_components/|
          ^external/|
          ^main/boot_logo\.[ch]$
          )
        types_or: [c++, c]
