# L1 host app for components/drive_session: the transition-table oracle by input (TS-UNIT-08,
# TS-UNIT-09; docs/plans/hazard-fixes.md B3). Cases DRV-101..115 in
# test/oracle_by_input/test_drive_session_oracle_by_input.cpp. Per input, every value of every
# guard dimension the table reads for it, in every phase, crossed with all (or, above 256
# points, a distance-3 corner sample plus seeded random points) of the dimensions it does not
# read. The full product (DRV-L1-FULL) runs on demand only (owner decision G2);
# `make equivalence` and `make mutants` in the app folder are the evidence that it is not weaker.
# spec-deviation(TS-UNIT-01): host-native g++ in WSL, not the IDF linux target (owner, 2026-10-06).
- id: DRV-L1-BYINPUT
  title: DriveSession against its transition table, by input (read guards in full, the rest sampled)
  level: L1
  path: components/drive_session/test/oracle_by_input
  requirements: [REQ-DRV-04, REQ-DRV-06, REQ-DRV-07, REQ-DRV-08, REQ-DRV-12, REQ-DRV-13,
                 REQ-DRV-14, REQ-DRV-15, REQ-DRV-16, REQ-DRV-22, REQ-DRV-23, REQ-DRV-24,
                 REQ-DRV-25, REQ-DRV-26, REQ-DRV-27, REQ-DRV-28, REQ-DRV-30]
  resources: [host]
  timeout_s: 300
  expected_s: 30
  repeat: 1
  pass_threshold: 1
  safety: true
  artifact: test
