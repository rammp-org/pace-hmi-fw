name: Build

# TODO: update if you want to allow from forked repositories
#
# `push` is here as well as `pull_request` because pull_request events on this
# repo record but never create runs (verified: workflow_dispatch green, three
# pull_request events across two PRs, zero runs). Until that is sorted at the
# org level, the push trigger is what actually gets a branch built. `main` is
# excluded because package_main.yml already covers it.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

env:
  # TODO: Update the below variables for your project
  APP_NAME: "rammp-hmi-p4"
  IDF_TARGET: 'esp32p4'
  IDF_VERSION: 'v6.0'
  IDF_COMPONENT_MANAGER: "1" # whether to enable the component manager or not
  FLASH_TOTAL_OVERRIDE: '16000000' # number of bytes of total flash (for percentage calculations)

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      # TODO: update this if you have submodules

    - name: Build main
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: "."
        target: ${{ env.IDF_TARGET }}

    - name: Determine Size Delta
      uses: esp-cpp/esp-idf-size-delta@v1
      with:
        app_name: ${{ env.APP_NAME }}
        app_path: "."
        idf_target: ${{ env.IDF_TARGET }}
        idf_version: ${{ env.IDF_VERSION }}
        idf_component_manager: ${{ env.IDF_COMPONENT_MANAGER }}
        flash_total_override: ${{ env.FLASH_TOTAL_OVERRIDE }}
