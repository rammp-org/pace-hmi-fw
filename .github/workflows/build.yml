name: Build

# TODO: update if you want to allow from forked repositories
#
# `push` is here as well as `pull_request` so a branch is built before it has a
# PR. pull_request events do create runs now (seen in `gh run list` since
# 2026-09-30), so a branch with an open PR is built twice. `main` is excluded
# because package_main.yml already covers it.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

env:
  # TODO: Update the below variables for your project
  APP_NAME: "rammp-hmi-p4"
  IDF_TARGET: 'esp32p4'
  IDF_VERSION: 'v6.0'
  IDF_COMPONENT_MANAGER: "1" # whether to enable the component manager or not
  FLASH_TOTAL_OVERRIDE: '16000000' # number of bytes of total flash (for percentage calculations)

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build main
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: "."
        target: ${{ env.IDF_TARGET }}

    # Guards G4 (static init) and G2 (exported symbols) on the default variant's objects
    # (docs/plans/app-main-shrink.md §5; tools/guards/README.md). In the IDF image: they need
    # its readelf/objdump/nm. The bench variant's run is in l0.yml.
    - name: Guards G4 init_order and G2 exports (default variant)
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: "."
        target: ${{ env.IDF_TARGET }}
        command: >-
          python3 tools/guards/init_order.py check --build build --variant default
          && python3 tools/guards/exports.py check --build build

    # Bench stick injection never ships (CS-LAY-09, hazard-fixes B1): the default build's
    # sdkconfig.h has it off and its ELF has no symbol of it. nm's output goes to a file first,
    # so a missing or failing nm fails the step instead of passing as "no match". l0.yml's
    # bench_inject build checks that the same patterns do match there. The hazard bench verbs
    # (STATE, PERMIT, CAL UNSAVED, POST RERUN, CRASH, STALL; REQ-RUI-05..07) are `bench_?verb`.
    - name: Release ELF has no stick injection and no bench verbs
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: "."
        target: ${{ env.IDF_TARGET }}
        command: >-
          grep -qx "#define CONFIG_HMI_BENCH_STICK_INJECT_AS_INT 0" build/config/sdkconfig.h
          && ! grep -q "^#define CONFIG_HMI_BENCH_STICK_INJECT 1" build/config/sdkconfig.h
          && riscv32-esp-elf-nm -C build/${{ env.APP_NAME }}.elf > build/release_nm.txt
          && test -s build/release_nm.txt
          && ! grep -Ei "stick_?inject" build/release_nm.txt
          && ! grep -Ei "bench_?verb" build/release_nm.txt

    - name: Determine Size Delta
      uses: esp-cpp/esp-idf-size-delta@v1
      with:
        app_name: ${{ env.APP_NAME }}
        app_path: "."
        idf_target: ${{ env.IDF_TARGET }}
        idf_version: ${{ env.IDF_VERSION }}
        idf_component_manager: ${{ env.IDF_COMPONENT_MANAGER }}
        flash_total_override: ${{ env.FLASH_TOTAL_OVERRIDE }}
