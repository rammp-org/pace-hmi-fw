name: L0

# L0 static checks that need no toolchain, plus the bench build variant
# (TESTING_SPEC TS-LVL: L0 on every PR; CS-LAY-09: every build variant built).
# push as well as pull_request so a branch is checked before it has a PR (see build.yml).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

env:
  IDF_TARGET: 'esp32p4'
  IDF_VERSION: 'v6.0'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        # Full history: ratchet.py check re-verifies transfer grants against their base commit.
        fetch-depth: 0
        # scripts/rammp_rtps.py (the MCB sim self test below) reads the shared spec headers
        submodules: recursive

    # ubuntu-latest (24.04) ships Python 3.12; both scripts are stdlib only.
    - name: Ratchet self test
      run: python3 tools/l0/ratchet.py selftest

    - name: Ratchet check (legacy counts may only fall; new files start clean)
      run: python3 tools/l0/ratchet.py check

    # No file includes another component's private src/ (CS-LAY-03; compliance-gaps.md gap 8).
    - name: Include boundary (no #include of another component's src/)
      run: |
        python3 tools/l0/include_boundary.py selftest
        python3 tools/l0/include_boundary.py check

    # CS-FMT-01: the repo's pre-commit hooks (clang-format 14.0.6) on every file.
    - name: Pre-commit (all files)
      run: |
        python3 -m pip install --quiet pre-commit
        pre-commit run --all-files --show-diff-on-failure

    - name: UI contract (SquareLine export vs what main.cpp assumes)
      run: python3 scripts/ui_contract.py

    - name: Diagrams (CS-ARC-02; generated parts match docs/architecture.md)
      run: |
        python3 tools/gen_diagrams/gen_diagrams.py selftest
        python3 tools/gen_diagrams/gen_diagrams.py check

    # tools/guards (docs/plans/app-main-shrink.md §5): parsers and rules on inline samples.
    # The checks against a build (init_order, exports) run after the builds below.
    - name: Guard self tests (G2 exports, G4 init_order, G10 task_dump, G11 observer_census)
      run: |
        python3 tools/guards/init_order.py selftest
        python3 tools/guards/exports.py selftest
        python3 tools/guards/task_dump.py selftest
        python3 tools/guards/observer_census.py selftest

    # The simulated MCB's decisions and bench fault modes (docs/plans/hazard-fixes.md §3 B5):
    # scripts/mcb_sim_logic.py, cases SIM-001.., no network and no tkinter.
    - name: MCB sim self test (rtps_mcb_sim.py decision logic)
      run: python3 scripts/rtps_mcb_sim.py selftest

    # tools/bench without a board: the remote-UI client (timeouts, retry, log) against a
    # localhost fake, and run_bench's step sequencing (waits after a reset) on a fake board.
    - name: Bench runner self tests (ui_client UI-*, run_bench BENCH-*)
      run: |
        python3 tools/bench/ui_client.py selftest
        python3 tools/bench/run_bench.py selftest

    # B3's comparison with the self-test baseline (pwr.* report-only, owner P3), on samples.
    - name: Bench self-test comparison self test (CMP)
      run: python3 tools/bench/compare_selftest.py selftest

    # check also fails the requirement-ID rules: a retired requirement cited by a test, an
    # ID declared twice or deleted from its series (tests/reqmatrix.py, TS-COV-01).
    - name: Test manifest and requirement IDs (TS-DEF-02, TS-COV-01)
      run: |
        python3 -m pip install --quiet pyyaml
        python3 tests/run.py selftest --matrix
        python3 tests/run.py check

    # Informational (docs/plans/hazard-fixes.md B4): the requirement -> test matrix and its
    # gaps (requirements with no test, tests with no requirement). It lists; it does not gate.
    - name: Requirement matrix (TS-COV-01, informational)
      run: |
        python3 tests/run.py report > /dev/null
        cat results/requirements/requirements.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the requirement matrix
      uses: actions/upload-artifact@v7
      with:
        name: requirement-matrix
        path: results/requirements/

    # Debug channels stay out of what ships (CS-LAY-09; plan H13): the remote UI can press
    # the stick button, and an OTA test URL bypasses the release check. The bench DA7280
    # test buzzes the motor at boot; the FPS report (and its stress mode) is debug only.
    # Bench stick injection (hazard-fixes B1) commands motion from the network. The Build
    # workflow also checks the release ELF for injection symbols.
    - name: Release defaults keep debug features off
      run: |
        ! grep -Eq '^CONFIG_HMI_REMOTE_UI=y' sdkconfig.defaults
        ! grep -Eq '^CONFIG_HMI_OTA_TEST_URL="[^"]+"' sdkconfig.defaults
        ! grep -Eq '^CONFIG_HMI_BENCH_DA7280_TEST(_AS_INT)?=(y|[1-9])' sdkconfig.defaults
        ! grep -Eq '^CONFIG_HMI_DEBUG_FPS(_STRESS)?(_AS_INT)?=(y|[1-9])' sdkconfig.defaults
        ! grep -Eq '^CONFIG_HMI_BENCH_STICK_INJECT(_AS_INT)?=(y|[1-9])' sdkconfig.defaults

  host-l1:
    # L1 host tests (tests/run.py). They need the espp headers, which the component
    # manager fetches during a reconfigure; the IDF image also has g++ and Unity.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: L1 host tests
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: "."
        target: ${{ env.IDF_TARGET }}
        command: >-
          idf.py reconfigure
          && pip install --quiet pyyaml
          && UNITY_DIR=$IDF_PATH/components/unity/unity/src python3 tests/run.py run --all --seed 1

  bench-build:
    # The bench variants, one job each: bench (the remote UI debug channel on,
    # ci/sdkconfig.bench) and bench_inject (bench plus stick injection,
    # ci/sdkconfig.stick_inject). Each has its own build dir and sdkconfig, so an overlay is
    # not shadowed by another config. Then guards G4 and G2 on its objects, inside the IDF
    # image (they need its readelf/objdump/nm). bench_inject's ELF must have symbols matching
    # the pattern build.yml keeps out of the release ELF: proof that the pattern matches the
    # real injection code, so its absence there means something.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: bench
            defaults: "sdkconfig.defaults;ci/sdkconfig.bench"
            inject: "0"
          - variant: bench_inject
            defaults: "sdkconfig.defaults;ci/sdkconfig.bench;ci/sdkconfig.stick_inject"
            inject: "1"
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build ${{ matrix.variant }} variant
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: ${{ env.IDF_VERSION }}
        path: "."
        target: ${{ env.IDF_TARGET }}
        command: >-
          idf.py -B build_${{ matrix.variant }} -D SDKCONFIG=build_${{ matrix.variant }}/sdkconfig
          -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build
          && grep -q "^#define CONFIG_HMI_REMOTE_UI 1" build_${{ matrix.variant }}/config/sdkconfig.h
          && grep -qx "#define CONFIG_HMI_BENCH_STICK_INJECT_AS_INT ${{ matrix.inject }}"
          build_${{ matrix.variant }}/config/sdkconfig.h
          && python3 tools/guards/init_order.py check --build build_${{ matrix.variant }}
          --variant ${{ matrix.variant }}
          && python3 tools/guards/exports.py check --build build_${{ matrix.variant }}
          && if [ "${{ matrix.inject }}" = 1 ]; then
          riscv32-esp-elf-nm -C build_${{ matrix.variant }}/rammp-hmi-p4.elf
          | grep -Eiq "stick_?inject"; fi
