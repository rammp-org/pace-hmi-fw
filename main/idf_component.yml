## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espp/task: '==1.3.2'
  # espp/m5stack-tab5 is vendored into components/m5stack-tab5 so the DPI panel
  # config (num_fbs) and the LVGL draw-buffer allocation can be modified for
  # performance. Removed from the manifest so the component manager does not
  # also fetch it into managed_components/ and collide with the local copy.
  # espp/adc is vendored into components/espp_adc (hazard fix C2, REQ-CTL-16: the window
  # maximum and sequence), removed here for the same reason as m5stack-tab5 above.
  espp/base_component: '==1.3.2'
  espp/button: '==1.3.2'
  espp/base_peripheral: '==1.3.2'
  espp/bmi270: '==1.3.2'
  espp/format: '==1.3.2'
  espp/logger: '==1.3.2'
  espp/cli: '==1.3.2'
  espp/codec: '==1.3.2'
  espp/display: '==1.3.2'
  espp/display_drivers: '==1.3.2'
  # DRV2605 haptic motor driver (the motor on the PCB's JST connector)
  espp/drv2605: '==1.3.2'
  espressif/esp-dsp: ^1.8.2
  espp/filters: '==1.3.2'
  # LittleFS on the `storage` partition: joystick calibration now, more later
  espp/file_system: '==1.3.2'
  espp/gt911: '==1.3.2'
  espp/i2c: '==1.3.2'
  espp/ina226: '==1.3.2'
  espp/input_drivers: '==1.3.2'
  espp/interrupt: '==1.3.2'
  espp/led: '==1.3.2'
  lvgl/lvgl: ^9.5.0
  espp/math: '==1.3.2'
  espp/rx8130ce: '==1.3.2'
  espp/pi4ioe5v: '==1.3.2'
  espp/spi: '==1.3.2'
  espp/touch: '==1.3.2'
  espp/st7123touch: '==1.3.2'
  # RTPS comms — these components first shipped in espp 1.1.6 (espp/rtps pulls
  # in espp/socket transitively; cdr is used directly for sample serialization)
  espp/rtps: '==1.3.2'
  espp/cdr: '==1.3.2'
  # Every espp component moves together, pinned: a re-solve (any manifest change)
  # otherwise pulls some of them to the newest and leaves a mixed set.
  espp/reflect_cpp: '==1.3.2'
  espp/socket: '==1.3.2'
  espp/thread_pool: '==1.3.2'
  espp/timer: '==1.3.2'
  # Pulled in by the Tab5 BSP; pinned for the same reason.
  espressif/usb: '==1.4.1'
  espressif/esp_sccb_intf: '==0.0.8'
  # W5500 SPI Ethernet MAC driver (split out of esp_eth in IDF 6.0)
  espressif/w5500: ^2.0.0
  # WiFi: the P4 has no radio; the Tab5's ESP32-C6 does it over SDIO (esp_hosted),
  # behind the usual esp_wifi API (esp_wifi_remote).
  espressif/esp_wifi_remote: '>=1.6.4'
  # 2.x, not 3.x: 3.x speaks only RPC-V2 and needs 3.x firmware on the C6, which the
  # Tab5 does not ship with.
  espressif/esp_hosted: '~2.12.11'
  # JSON for GitHub's release list (github_ota.cpp); IDF 6.0 no longer ships cJSON.
  espressif/cjson: ^1.7.19
