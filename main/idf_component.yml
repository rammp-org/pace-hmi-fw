## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  # TEST ONLY (dev_ai_integ_espp_prs, never merged): every espp component comes from a local
  # espp worktree, ../../espp-test from here (~/Documents/ATDev/w/espp-test, espp branch
  # test-all-prs: upstream main 01aaa970 = v1.3.8 plus the seven PR branches drafted in
  # ~/Documents/ATDev/espp_pr_drafts). Nothing espp is vendored: espp_adc, espp_rtps,
  # m5stack-tab5 and joystick come from there as they are. Every espp component, the ones the
  # others pull in included, is listed so that one source serves them all (CS-LAY-06).
  # CI cannot resolve these paths.
  espp/adc:
    override_path: '../../espp-738/components/adc'
  espp/base_component:
    override_path: '../../espp-738/components/base_component'
  espp/base_peripheral:
    override_path: '../../espp-738/components/base_peripheral'
  espp/bmi270:
    override_path: '../../espp-738/components/bmi270'
  espp/button:
    override_path: '../../espp-738/components/button'
  espp/cdr:
    override_path: '../../espp-738/components/cdr'
  espp/cli:
    override_path: '../../espp-738/components/cli'
  espp/codec:
    override_path: '../../espp-738/components/codec'
  espp/display:
    override_path: '../../espp-738/components/display'
  espp/display_drivers:
    override_path: '../../espp-738/components/display_drivers'
  espp/drv2605:
    override_path: '../../espp-738/components/drv2605'
  espp/file_system:
    override_path: '../../espp-738/components/file_system'
  espp/filters:
    override_path: '../../espp-738/components/filters'
  espp/format:
    override_path: '../../espp-738/components/format'
  espp/gt911:
    override_path: '../../espp-738/components/gt911'
  espp/i2c:
    override_path: '../../espp-738/components/i2c'
  espp/ina226:
    override_path: '../../espp-738/components/ina226'
  espp/input_drivers:
    override_path: '../../espp-738/components/input_drivers'
  espp/interrupt:
    override_path: '../../espp-738/components/interrupt'
  espp/joystick:
    override_path: '../../espp-738/components/joystick'
  espp/led:
    override_path: '../../espp-738/components/led'
  espp/logger:
    override_path: '../../espp-738/components/logger'
  espp/m5stack-tab5:
    override_path: '../../espp-738/components/m5stack-tab5'
  espp/math:
    override_path: '../../espp-738/components/math'
  espp/pi4ioe5v:
    override_path: '../../espp-738/components/pi4ioe5v'
  espp/reflect_cpp:
    override_path: '../../espp-738/components/reflect_cpp'
  espp/rtps:
    override_path: '../../espp-738/components/rtps'
  espp/rx8130ce:
    override_path: '../../espp-738/components/rx8130ce'
  espp/sdcard:
    override_path: '../../espp-738/components/sdcard'
  espp/socket:
    override_path: '../../espp-738/components/socket'
  espp/spi:
    override_path: '../../espp-738/components/spi'
  espp/st7123touch:
    override_path: '../../espp-738/components/st7123touch'
  espp/task:
    override_path: '../../espp-738/components/task'
  espp/thread_pool:
    override_path: '../../espp-738/components/thread_pool'
  espp/timer:
    override_path: '../../espp-738/components/timer'
  espp/touch:
    override_path: '../../espp-738/components/touch'
  espressif/esp-dsp: ^1.8.2
  lvgl/lvgl: ^9.5.0
  # Pulled in by the Tab5 BSP; pinned, so a re-solve does not move them.
  espressif/usb: '==1.4.1'
  espressif/esp_sccb_intf: '==0.0.8'
  espressif/usb_host_uvc: '==2.5.1'
  # W5500 SPI Ethernet MAC driver (split out of esp_eth in IDF 6.0)
  espressif/w5500: ^2.0.0
  # WiFi: the P4 has no radio; the Tab5's ESP32-C6 does it over SDIO (esp_hosted),
  # behind the usual esp_wifi API (esp_wifi_remote).
  espressif/esp_wifi_remote: '>=1.6.4'
  # 2.x, not 3.x: 3.x speaks only RPC-V2 and needs 3.x firmware on the C6, which the
  # Tab5 does not ship with.
  espressif/esp_hosted: '~2.12.11'
  # JSON for GitHub's release list (github_ota.cpp); IDF 6.0 no longer ships cJSON.
  espressif/cjson: ^1.7.19
